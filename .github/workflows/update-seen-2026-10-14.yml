name: Update Seen Stories 2026-10-14

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-seen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run update script
        run: python3 scripts/update_seen_2026_10_14.py

      - name: Commit and push
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude Sonnet 4.6"
          git add memory/seen.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update seen stories [2026-10-14]

Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>
Claude-Session: https://claude.ai/code/session_01Wuw4cMVhJhb4ZN1R3Sinn7"
            git push
          else
            echo "No changes to commit - seen.json already up to date"
          fi
